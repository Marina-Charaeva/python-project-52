{% extends 'base.html' %}
{% load django_bootstrap5 %}
{% load i18n %}

{% block content %}
<div class="container mt-5">
  <h2>Удаление пользователя</h2>
  <p>Вы уверены, что хотите удалить пользователя {{ object.username }}?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'users' %}" class="btn btn-secondary">Отмена</a>
  </form>
</div>
{% endblock %}
